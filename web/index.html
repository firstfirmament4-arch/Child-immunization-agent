<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaccins de mon enfant · My child's vaccines</title>
<style>
  :root { --bg:#f4f7f5; --card:#fff; --text:#1c2b25; --muted:#5d6f66; --brand:#1f7a5a; --brand2:#2fae86; --brand-ink:#fff;
          --bubble-user:#1f7a5a; --bubble-agent:#fff; --border:#dbe5df; --warn:#fff6e0; --shadow:0 1px 3px rgba(20,40,30,.08); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1512; --card:#182420; --text:#e6efe9; --muted:#95a89e; --brand:#3fae86; --brand2:#57d4a8; --brand-ink:#08130e;
            --bubble-user:#2b8f6b; --bubble-agent:#1f2b26; --border:#2b3a33; --warn:#2b2614; --shadow:0 1px 4px rgba(0,0,0,.35); }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100dvh; padding-top:env(safe-area-inset-top); }
  header { display:flex; align-items:center; gap:.6rem; padding:.8rem 1rem; color:#fff;
           background:linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow:var(--shadow); }
  header h1 { font-size:1rem; margin:0; flex:1; font-weight:700; letter-spacing:.01em; }
  .badge { font-size:.7rem; padding:.15rem .55rem; border-radius:99px; background:rgba(255,255,255,.2); color:#fff; }
  button { font:inherit; cursor:pointer; }
  .ghost { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:.6rem; padding:.35rem .7rem; font-size:.85rem; transition:background .15s; }
  .ghost:active { background:rgba(255,255,255,.3); }
  main { flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; }
  .screen { display:none; padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom)); animation:fadein .25s ease; }
  .screen.active { display:block; }
  @keyframes fadein { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .centered { margin:auto; max-width:26rem; text-align:center; width:100%; }
  h2 { margin:.2rem 0 .4rem; font-size:1.3rem; }
  .sub { color:var(--muted); margin:.3rem 0 1.2rem; line-height:1.45; }
  .big-btn { display:flex; align-items:center; gap:.8rem; width:100%; margin:.5rem 0; padding:1rem; font-size:1.05rem;
             border-radius:1rem; border:2px solid var(--brand); background:var(--card); color:var(--text); text-align:left;
             box-shadow:var(--shadow); transition:transform .1s, background .15s; }
  .big-btn:active { background:var(--brand); color:var(--brand-ink); transform:scale(.98); }
  .big-btn .ic { font-size:1.6rem; }
  #chat { flex:1; min-height:0; flex-direction:column; padding:0; }
  #chat.active { display:flex; }
  #messages { flex:1; overflow-y:auto; padding:1rem .8rem; display:flex; flex-direction:column; gap:.6rem; }
  .msg { max-width:88%; padding:.65rem .9rem; border-radius:1.1rem; line-height:1.45; word-wrap:break-word; overflow-wrap:anywhere;
         box-shadow:var(--shadow); animation:pop .18s ease; }
  @keyframes pop { from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }
  .msg p { margin:.15rem 0; } .msg ul { margin:.3rem 0; padding-left:1.2rem; }
  .agent { align-self:flex-start; background:var(--bubble-agent); border:1px solid var(--border); border-bottom-left-radius:.3rem; }
  .user { align-self:flex-end; background:linear-gradient(135deg, var(--bubble-user), var(--brand2)); color:#fff;
          border-bottom-right-radius:.3rem; white-space:pre-wrap; box-shadow:none; }
  .system { align-self:center; background:var(--warn); color:var(--muted); font-size:.85rem; border:1px solid var(--border); box-shadow:none; }
  .table-wrap { overflow-x:auto; margin:.3rem 0; }
  table { border-collapse:collapse; font-size:.85rem; } th, td { border:1px solid var(--border); padding:.25rem .5rem; text-align:left; }
  .dots { display:inline-flex; gap:.25rem; align-items:center; }
  .dots span { width:.4rem; height:.4rem; border-radius:50%; background:var(--muted); animation:bounce 1.1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay:.15s; } .dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;} }
  .slow-hint { display:block; margin-top:.3rem; font-size:.78rem; opacity:.8; }
  #bar { display:flex; gap:.5rem; padding:.5rem .7rem; background:var(--card); border-top:1px solid var(--border); }
  #tools { display:flex; gap:.5rem; padding:.4rem .7rem 0; background:var(--card); }
  #input { flex:1; font:inherit; font-size:1rem; padding:.7rem .9rem; border-radius:1.4rem; border:1px solid var(--border);
           background:var(--bg); color:var(--text); min-width:0; transition:border-color .15s; }
  #input:focus { outline:none; border-color:var(--brand); }
  #send { background:linear-gradient(135deg, var(--brand), var(--brand2)); color:var(--brand-ink); border:0; border-radius:1.4rem;
          padding:0 1.2rem; font-weight:700; transition:transform .1s; }
  #send:active { transform:scale(.95); }
  #send:disabled, #input:disabled { opacity:.5; }
  footer { font-size:.72rem; color:var(--muted); text-align:center; padding:.4rem .8rem calc(.4rem + env(safe-area-inset-bottom)); background:var(--card); }
  dialog { border:1px solid var(--border); border-radius:1.1rem; background:var(--card); color:var(--text); width:min(92vw,34rem); padding:1rem; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog pre { white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; max-height:60vh; overflow:auto; margin:.5rem 0; }
  .row { display:flex; gap:.5rem; justify-content:flex-end; }
  select#ageSelect { font:inherit; font-size:1.15rem; width:100%; padding:.9rem; border-radius:.9rem; border:2px solid var(--brand);
             background:var(--card); color:var(--text); margin:1rem 0; }
  .primary { background:linear-gradient(135deg, var(--brand), var(--brand2)); color:var(--brand-ink); border:0; border-radius:.9rem;
             padding:.9rem; font-size:1.05rem; font-weight:700; width:100%; margin-top:.6rem; box-shadow:var(--shadow); transition:transform .1s; }
  .primary:active { transform:scale(.98); }
  .primary:disabled { opacity:.5; }
  .visit-group { text-align:left; margin:1rem 0; }
  .visit-group h3 { font-size:.95rem; color:var(--muted); margin:0 0 .4rem; text-transform:uppercase; letter-spacing:.03em; }
  .vaccine-row { display:flex; align-items:center; gap:.7rem; padding:.75rem; border:1px solid var(--border); border-radius:.8rem;
                 background:var(--card); margin-bottom:.5rem; box-shadow:var(--shadow); transition:border-color .15s; }
  .vaccine-row:has(input:checked) { border-color:var(--brand); }
  .vaccine-row input { width:1.4rem; height:1.4rem; flex-shrink:0; accent-color:var(--brand); }
  .vaccine-row .ic { font-size:1.4rem; }
  .vaccine-row .txt { flex:1; text-align:left; }
  .vaccine-row .txt .name { font-weight:600; }
  .vaccine-row .txt .disease { font-size:.8rem; color:var(--muted); }
  #guidedResultText { text-align:left; white-space:pre-wrap; background:var(--bg); border:1px solid var(--border);
                      border-radius:.8rem; padding:.9rem; font-size:.9rem; margin:1rem 0; }
  .menu-list .big-btn { padding:.85rem 1rem; }
  .vaccine-card { text-align:left; border:1px solid var(--border); border-radius:.8rem; background:var(--card);
                  margin-bottom:.6rem; box-shadow:var(--shadow); overflow:hidden; }
  .vaccine-card summary { list-style:none; cursor:pointer; padding:.8rem .9rem; display:flex; align-items:center; gap:.6rem; }
  .vaccine-card summary::-webkit-details-marker { display:none; }
  .vaccine-card summary .vname { font-weight:700; flex:1; }
  .vaccine-card summary .vdisease { font-size:.8rem; color:var(--muted); }
  .vaccine-card .vbody { padding:0 .9rem .9rem; font-size:.88rem; line-height:1.5; }
  .vaccine-card .vbody .row-line { margin:.35rem 0; }
  .vaccine-card .vbody b { color:var(--muted); font-weight:600; }
  .tag-autre { display:inline-block; font-size:.7rem; padding:.1rem .5rem; border-radius:99px; background:var(--warn); color:var(--muted); margin-left:.4rem; }
  .cal-item { padding:.3rem 0; }

</style>
</head>
<body>
<header>
  <h1 id="title">Vaccins de mon enfant</h1>
  <span class="badge" id="mode" hidden></span>
  <button class="ghost" id="homeBtn" hidden>🏠</button>
  <button class="ghost" id="restart" hidden></button>
</header>

<main>
  <section id="welcome" class="screen active">
    <div class="centered">
      <h2>Bienvenue · Welcome</h2>
      <p class="sub">Suivez les vaccins de votre enfant (0–5 ans, Cameroun). Aucun compte, aucun nom.<br>
         Track your child's vaccines (ages 0–5, Cameroon). No account, no name.</p>
      <button class="big-btn" data-lang="fr"><span class="ic">🇫🇷</span> Français</button>
      <button class="big-btn" data-lang="en"><span class="ic">🇬🇧</span> English</button>
    </div>
  </section>

  <section id="modeSelect" class="screen">
    <div class="centered menu-list">
      <h2 id="modeTitle"></h2>
      <p class="sub" id="modeSub"></p>
      <button class="big-btn" id="chooseLibrary"><span class="ic">📚</span> <span id="chooseLibraryLabel"></span></button>
      <button class="big-btn" id="chooseCalendar"><span class="ic">📅</span> <span id="chooseCalendarLabel"></span></button>
      <button class="big-btn" id="chooseChat"><span class="ic">💬</span> <span id="chooseChatLabel"></span></button>
      <button class="big-btn" id="chooseGuided"><span class="ic">☑️</span> <span id="chooseGuidedLabel"></span></button>
      <button class="big-btn" id="choosePrivacy"><span class="ic">🔒</span> <span id="choosePrivacyLabel"></span></button>
    </div>
  </section>

  <section id="library" class="screen">
    <div class="centered">
      <h2 id="libraryTitle"></h2>
      <p class="sub" id="librarySub"></p>
      <div id="libraryBody"></div>
    </div>
  </section>

  <section id="calendarView" class="screen">
    <div class="centered">
      <h2 id="calendarTitle"></h2>
      <p class="sub" id="calendarSub"></p>
      <select id="calAgeSelect"></select>
      <button class="primary" id="calAgeNext"></button>
      <div id="calendarBody" style="margin-top:1rem; text-align:left"></div>
    </div>
  </section>

  <section id="privacy" class="screen">
    <div class="centered" id="privacyBody" style="text-align:left"></div>
  </section>

  <section id="guidedAge" class="screen">
    <div class="centered">
      <h2 id="guidedAgeTitle"></h2>
      <p class="sub" id="guidedAgeSub"></p>
      <select id="ageSelect"></select>
      <button class="primary" id="ageNext"></button>
    </div>
  </section>

  <section id="guidedChecklist" class="screen">
    <div class="centered">
      <h2 id="checklistTitle"></h2>
      <p class="sub" id="checklistSub"></p>
      <div id="checklistBody"></div>
      <button class="primary" id="checklistSubmit"></button>
    </div>
  </section>

  <section id="guidedResult" class="screen">
    <div class="centered">
      <h2 id="resultTitle"></h2>
      <div id="guidedResultText"></div>
      <button class="primary" id="resultChat"></button>
      <button class="big-btn" id="resultRestart" style="margin-top:.5rem"><span class="ic">🔄</span> <span id="resultRestartLabel"></span></button>
    </div>
  </section>

  <section id="chat">
    <div id="messages" aria-live="polite"></div>
    <div id="tools"><button class="ghost" id="summaryBtn"></button></div>
    <form id="bar" autocomplete="off">
      <input id="input" maxlength="1000" enterkeyhint="send">
      <button id="send" type="submit"></button>
    </form>
  </section>
</main>

<footer id="disclaimer"></footer>

<dialog id="summaryDialog">
  <strong id="summaryTitle"></strong>
  <pre id="summaryText"></pre>
  <div class="row"><button class="ghost" id="copyBtn"></button><button class="ghost" id="closeBtn"></button></div>
</dialog>

<script>
const UI = {
  fr: { title:"Vaccins de mon enfant", placeholder:"Écrivez votre message…", send:"Envoyer", summary:"📋 Fiche de suivi",
        restart:"Nouvelle conversation", copy:"Copier", copied:"Copié ✓", close:"Fermer", typing:"…",
        summaryTitle:"Fiche de suivi vaccinal", rulesNote:"Mode hors-ligne (français uniquement)",
        disclaimer:"Information uniquement — ne remplace pas un professionnel de santé. Conversation anonyme, non enregistrée.",
        netError:"Connexion impossible. Vérifiez votre réseau et réessayez.",
        modeTitle:"Comment préférez-vous continuer ?", modeSub:"Les deux options font la même chose.",
        chooseChat:"Discuter librement", chooseGuided:"Cocher les vaccins (sans écrire)",
        guidedAgeTitle:"Quel âge a l'enfant ?", guidedAgeSub:"Choisissez dans la liste, sans avoir à écrire.",
        ageNext:"Continuer", checklistTitle:"Vaccins déjà reçus ?",
        checklistSub:"Cochez uniquement ce qui a déjà été donné. Ne cochez rien si vous n'êtes pas sûr(e).",
        checklistSubmit:"Voir le résultat", resultTitle:"Voici ce que nous avons trouvé",
        resultChat:"💬 Poser une question à l'agent", resultRestart:"Recommencer",
        ageOptionBirth:"À la naissance", ageOptionMonth:"mois", ageOptionMonths:"mois",
        home:"Accueil", chooseLibrary:"Bibliothèque des vaccins", chooseCalendar:"Explorer le calendrier",
        choosePrivacy:"Confidentialité & limites de l'agent",
        libraryTitle:"Bibliothèque des vaccins", librarySub:"Touchez un vaccin pour en savoir plus. Informations issues du calendrier officiel du PEV Cameroun.",
        calendarTitle:"Calendrier vaccinal", calendarSub:"Choisissez un âge pour voir ce qui est prévu — sans rien enregistrer.",
        calAgeNext:"Afficher", noneDueYet:"Rien n'est encore prévu à cet âge.",
        routeLabel:"Voie d'administration", sideEffectsLabel:"Effets secondaires possibles", whyLabel:"Pourquoi c'est important",
        statusLabel:"Statut", sourceLabel:"Source", otherIntervention:"autre intervention (pas un vaccin)",
        privacyTitle:"Confidentialité & limites de l'agent",
        privacyBody:"<p><b>Aucune donnée personnelle.</b> Pas de nom, pas de compte, rien n'est enregistré sur un serveur de façon permanente.</p><p><b>L'agent PEUT :</b> informer sur les vaccins, suivre le calendrier, répondre à vos questions, corriger une idée reçue avec une source officielle, générer une fiche de suivi.</p><p><b>L'agent NE PEUT PAS :</b> poser un diagnostic, prescrire un traitement, décider à la place d'un professionnel de santé, ou remplacer une consultation médicale.</p><p>En cas de doute ou d'inquiétude concernant votre enfant, adressez-vous toujours à un centre de santé.</p>" },
  en: { title:"My child's vaccines", placeholder:"Type your message…", send:"Send", summary:"📋 Follow-up sheet",
        restart:"New conversation", copy:"Copy", copied:"Copied ✓", close:"Close", typing:"…",
        summaryTitle:"Vaccination follow-up sheet", rulesNote:"Offline mode (French only)",
        disclaimer:"Information only — does not replace a healthcare professional. Anonymous conversation, not stored.",
        netError:"Connection failed. Check your network and try again.",
        modeTitle:"How would you like to continue?", modeSub:"Both options do the same thing.",
        chooseChat:"Chat freely", chooseGuided:"Check off vaccines (no typing)",
        guidedAgeTitle:"How old is the child?", guidedAgeSub:"Pick from the list, no typing needed.",
        ageNext:"Continue", checklistTitle:"Vaccines already given?",
        checklistSub:"Only check what has already been given. Leave unchecked if unsure.",
        checklistSubmit:"See result", resultTitle:"Here is what we found",
        resultChat:"💬 Ask the agent a question", resultRestart:"Start over",
        ageOptionBirth:"At birth", ageOptionMonth:"month", ageOptionMonths:"months",
        home:"Home", chooseLibrary:"Vaccine library", chooseCalendar:"Explore the calendar",
        choosePrivacy:"Privacy & agent limits",
        libraryTitle:"Vaccine library", librarySub:"Tap a vaccine to learn more. Information from Cameroon's official EPI calendar.",
        calendarTitle:"Immunization calendar", calendarSub:"Pick an age to see what's due — nothing is recorded.",
        calAgeNext:"Show", noneDueYet:"Nothing is due yet at this age.",
        routeLabel:"Route of administration", sideEffectsLabel:"Possible side effects", whyLabel:"Why it matters",
        statusLabel:"Status", sourceLabel:"Source", otherIntervention:"other intervention (not a vaccine)",
        privacyTitle:"Privacy & agent limits",
        privacyBody:"<p><b>No personal data.</b> No name, no account, nothing is permanently stored on a server.</p><p><b>The agent CAN:</b> inform about vaccines, track the calendar, answer your questions, correct a misconception with an official source, generate a follow-up sheet.</p><p><b>The agent CANNOT:</b> make a diagnosis, prescribe treatment, decide on behalf of a healthcare professional, or replace a medical consultation.</p><p>If in doubt or worried about your child, always contact a health center.</p>" }
};
let lang = "fr", sessionId = null, busy = false, guidedAgeMonths = 0, guidedVisits = [];
const $ = id => document.getElementById(id);

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function tableHtml(rows){
  const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c => inline(c.trim()));
  const data = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(cells);
  if (!data.length) return "";
  const head = "<tr>" + data[0].map(c => "<th>"+c+"</th>").join("") + "</tr>";
  const body = data.slice(1).map(r => "<tr>" + r.map(c => "<td>"+c+"</td>").join("") + "</tr>").join("");
  return '<div class="table-wrap"><table>' + head + body + "</table></div>";
}
function renderMarkdown(text){  // échappe TOUT le HTML d'abord, puis ne réintroduit que nos balises
  const lines = esc(text).split("\n"), out = [];
  let i = 0;
  const isRow = l => /^\s*\|.*\|\s*$/.test(l), isLi = l => /^\s*[-*•]\s+/.test(l);
  while (i < lines.length){
    if (isRow(lines[i])){ const rows=[]; while(i<lines.length && isRow(lines[i])) rows.push(lines[i++]); out.push(tableHtml(rows)); }
    else if (isLi(lines[i])){ const it=[]; while(i<lines.length && isLi(lines[i])) it.push("<li>"+inline(lines[i++].replace(/^\s*[-*•]\s+/,""))+"</li>"); out.push("<ul>"+it.join("")+"</ul>"); }
    else if (!lines[i].trim()){ i++; }
    else { out.push("<p>"+inline(lines[i++])+"</p>"); }
  }
  return out.join("");
}
function addMessage(kind, text){
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (kind === "agent") el.innerHTML = renderMarkdown(text); else el.textContent = text;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}
async function api(path, body){
  const res = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  let data = {}; try { data = await res.json(); } catch(e) {}
  return { ok: res.ok, status: res.status, data };
}
function showScreen(id){
  document.querySelectorAll(".screen, #chat").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
function applyLang(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  $("title").textContent = t.title; $("input").placeholder = t.placeholder; $("send").textContent = t.send;
  $("summaryBtn").textContent = t.summary; $("restart").textContent = t.restart; $("closeBtn").textContent = t.close;
  $("copyBtn").textContent = t.copy; $("summaryTitle").textContent = t.summaryTitle; $("disclaimer").textContent = t.disclaimer;
  $("modeTitle").textContent = t.modeTitle; $("modeSub").textContent = t.modeSub;
  $("chooseChatLabel").textContent = t.chooseChat; $("chooseGuidedLabel").textContent = t.chooseGuided;
  $("guidedAgeTitle").textContent = t.guidedAgeTitle; $("guidedAgeSub").textContent = t.guidedAgeSub; $("ageNext").textContent = t.ageNext;
  $("checklistTitle").textContent = t.checklistTitle; $("checklistSub").textContent = t.checklistSub; $("checklistSubmit").textContent = t.checklistSubmit;
  $("resultTitle").textContent = t.resultTitle; $("resultChat").textContent = t.resultChat; $("resultRestartLabel").textContent = t.resultRestart;
  $("chooseLibraryLabel").textContent = t.chooseLibrary; $("chooseCalendarLabel").textContent = t.chooseCalendar; $("choosePrivacyLabel").textContent = t.choosePrivacy;
  $("libraryTitle").textContent = t.libraryTitle; $("librarySub").textContent = t.librarySub;
  $("calendarTitle").textContent = t.calendarTitle; $("calendarSub").textContent = t.calendarSub; $("calAgeNext").textContent = t.calAgeNext;
  $("privacyBody").innerHTML = '<h2>' + t.privacyTitle + '</h2>' + t.privacyBody;
}
function setBusy(b){ busy = b; $("send").disabled = b; $("input").disabled = b; $("summaryBtn").disabled = b; if(!b) $("input").focus(); }
function populateAgeSelect(selectId){
  const t = UI[lang], sel = $(selectId); sel.innerHTML = "";
  const opt0 = document.createElement("option"); opt0.value = "0"; opt0.textContent = t.ageOptionBirth; sel.appendChild(opt0);
  for (let m = 1; m <= 60; m++){
    const o = document.createElement("option"); o.value = String(m);
    o.textContent = m + " " + (m === 1 ? t.ageOptionMonth : t.ageOptionMonths);
    sel.appendChild(o);
  }
}

async function loadLibrary(){
  const t = UI[lang];
  const r = await api("/api/library", { session_id: sessionId });
  const body = $("libraryBody"); body.innerHTML = "";
  if (!r.ok){ body.innerHTML = '<p class="sub">' + t.netError + '</p>'; showScreen("library"); return; }
  r.data.vaccines.forEach(v => {
    const card = document.createElement("details"); card.className = "vaccine-card";
    const sideEffects = (v.side_effects || []).map(esc).join(", ");
    card.innerHTML =
      '<summary><span class="vname">'+esc(v.name)+'</span><span class="vdisease">'+esc(v.disease_label||"")+'</span></summary>' +
      '<div class="vbody">' +
        '<div class="row-line"><b>'+t.statusLabel+' :</b> '+esc(v.pev_status)+'</div>' +
        '<div class="row-line"><b>'+t.routeLabel+' :</b> '+esc(v.route)+'</div>' +
        '<div class="row-line"><b>'+t.sideEffectsLabel+' :</b> '+sideEffects+'</div>' +
        '<div class="row-line"><b>'+t.whyLabel+' :</b> '+esc(v.why_it_matters)+'</div>' +
        '<div class="row-line"><b>'+t.sourceLabel+' :</b> '+esc(v.source||"")+'</div>' +
      '</div>';
    body.appendChild(card);
  });
  showScreen("library");
}

async function loadCalendarView(){
  const t = UI[lang];
  const ageMonths = Number($("calAgeSelect").value);
  const r = await api("/api/calendar", { session_id: sessionId, age_months: ageMonths });
  const body = $("calendarBody"); body.innerHTML = "";
  if (!r.ok){ body.innerHTML = '<p class="sub">' + t.netError + '</p>'; return; }
  if (!r.data.visits.length){ body.innerHTML = '<p class="sub">' + t.noneDueYet + '</p>'; return; }
  r.data.visits.forEach(visit => {
    const group = document.createElement("div"); group.className = "visit-group";
    const h = document.createElement("h3"); h.textContent = visit.age_label; group.appendChild(h);
    visit.vaccines.forEach(v => {
      const p = document.createElement("div"); p.className = "cal-item";
      p.innerHTML = '💉 <strong>'+esc(v.name)+'</strong>' + (v.disease_label ? ' — '+esc(v.disease_label) : '');
      group.appendChild(p);
    });
    visit.autres.forEach(a => {
      const p = document.createElement("div"); p.className = "cal-item";
      p.innerHTML = '💊 '+esc(a.label)+'<span class="tag-autre">'+t.otherIntervention+'</span>' +
        (a.regional_note ? '<br><span class="sub" style="margin:0">'+esc(a.regional_note)+'</span>' : '');
      group.appendChild(p);
    });
    body.appendChild(group);
  });
}

async function chooseLanguage(chosen){
  lang = chosen; applyLang();
  const r = await api("/api/start", { language: chosen });
  if (!r.ok){ alert(UI[lang].netError); return; }
  sessionId = r.data.session_id; lang = r.data.language; applyLang();
  window._greeting = r.data.greeting; window._mode = r.data.mode;
  $("restart").hidden = false; $("homeBtn").hidden = false;
  if (r.data.mode === "rules"){ $("mode").textContent = UI.fr.rulesNote; $("mode").hidden = false; }
  showScreen("modeSelect");
}
function goChat(){
  $("messages").innerHTML = "";
  addMessage("agent", window._greeting);
  showScreen("chat"); $("input").focus();
}
function goGuided(){ populateAgeSelect("ageSelect"); showScreen("guidedAge"); }
function goCalendar(){ populateAgeSelect("calAgeSelect"); $("calendarBody").innerHTML = ""; showScreen("calendarView"); }

async function loadChecklist(){
  const r = await api("/api/guided/checklist", { session_id: sessionId, age_months: guidedAgeMonths });
  if (!r.ok){ alert(UI[lang].netError); return; }
  guidedVisits = r.data.visits;
  const body = $("checklistBody"); body.innerHTML = "";
  if (!guidedVisits.length){
    body.innerHTML = '<p class="sub">' + (lang === "en" ? "No vaccine is due yet at this age." : "Aucun vaccin n'est encore dû à cet âge.") + "</p>";
  }
  guidedVisits.forEach((visit, vi) => {
    const group = document.createElement("div"); group.className = "visit-group";
    const h = document.createElement("h3"); h.textContent = visit.age_label; group.appendChild(h);
    visit.items.forEach((item, ii) => {
      const row = document.createElement("label"); row.className = "vaccine-row";
      row.innerHTML = '<input type="checkbox" data-visit="'+vi+'" data-item="'+ii+'">' +
        '<span class="ic">'+item.icon+'</span>' +
        '<span class="txt"><span class="name">'+esc(item.vaccine)+'</span>' +
        (item.disease_label ? '<br><span class="disease">'+esc(item.disease_label)+'</span>' : '') + '</span>';
      group.appendChild(row);
    });
    body.appendChild(group);
  });
  showScreen("guidedChecklist");
}
async function submitChecklist(){
  const checked = [];
  document.querySelectorAll('#checklistBody input[type="checkbox"]:checked').forEach(cb => {
    const visit = guidedVisits[+cb.dataset.visit], item = visit.items[+cb.dataset.item];
    checked.push({ vaccine: item.vaccine });
  });
  const r = await api("/api/guided/submit", { session_id: sessionId, age_months: guidedAgeMonths, checked });
  if (!r.ok){ alert(UI[lang].netError); return; }
  $("guidedResultText").textContent = r.data.summary;
  showScreen("guidedResult");
}
async function sendMessage(text){
  addMessage("user", text); setBusy(true);
  const typing = addMessage("system typing", "");
  typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  const slowTimer = setTimeout(() => {
    const hint = document.createElement("span"); hint.className = "slow-hint";
    hint.textContent = lang === "en" ? "Still thinking, this can take a few seconds…" : "Toujours en train de réfléchir, ça peut prendre quelques secondes…";
    typing.appendChild(hint);
  }, 4000);
  try {
    const r = await api("/api/chat", { session_id: sessionId, message: text });
    clearTimeout(slowTimer); typing.remove();
    if (r.ok) addMessage("agent", r.data.reply); else addMessage("system", r.data.error || UI[lang].netError);
  } catch(e){ clearTimeout(slowTimer); typing.remove(); addMessage("system", UI[lang].netError); }
  setBusy(false);
}
function fullRestart(){
  sessionId = null; $("restart").hidden = true; $("homeBtn").hidden = true; $("mode").hidden = true; $("messages").innerHTML = "";
  showScreen("welcome");
}

document.querySelectorAll("#welcome .big-btn").forEach(b => b.addEventListener("click", () => chooseLanguage(b.dataset.lang)));
$("homeBtn").addEventListener("click", () => showScreen("modeSelect"));
$("chooseLibrary").addEventListener("click", loadLibrary);
$("chooseCalendar").addEventListener("click", goCalendar);
$("choosePrivacy").addEventListener("click", () => showScreen("privacy"));
$("calAgeNext").addEventListener("click", loadCalendarView);
$("chooseChat").addEventListener("click", goChat);
$("chooseGuided").addEventListener("click", goGuided);
$("ageNext").addEventListener("click", () => { guidedAgeMonths = Number($("ageSelect").value); loadChecklist(); });
$("checklistSubmit").addEventListener("click", submitChecklist);
$("resultChat").addEventListener("click", async () => {
  // Nouvelle conversation propre pour le chat, afin d'éviter tout double-comptage
  // des vaccins déjà cochés (l'agent conversationnel ne connaît pas l'historique du mode guidé).
  const r = await api("/api/start", { language: lang });
  if (r.ok){ sessionId = r.data.session_id; window._greeting = r.data.greeting; goChat(); }
});
$("resultRestart").addEventListener("click", fullRestart);
$("restart").addEventListener("click", fullRestart);
$("bar").addEventListener("submit", e => {
  e.preventDefault(); const text = $("input").value.trim();
  if (!text || busy) return; $("input").value = ""; sendMessage(text);
});
$("summaryBtn").addEventListener("click", async () => {
  const r = await api("/api/summary", { session_id: sessionId });
  $("summaryText").textContent = r.ok ? r.data.summary : (r.data.error || UI[lang].netError);
  $("summaryDialog").showModal();
});
$("closeBtn").addEventListener("click", () => $("summaryDialog").close());
$("copyBtn").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("summaryText").textContent); $("copyBtn").textContent = UI[lang].copied;
        setTimeout(() => $("copyBtn").textContent = UI[lang].copy, 1500); } catch(e) {}
});
applyLang();
</script>
</body>
</html>
